- name: install files
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: install packages
    ansible.builtin.package:
      name: "{{ item }}"
      state: present  
      enabled: yes 

  - name: start the service
    ansible.builtin.service:
      name: "{{ item }}"
      state: started 
    loop:
    - gcc
    - mysql
    - git
    - zip  
