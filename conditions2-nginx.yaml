- name: install nginx
  hosts: local
  connection: local
  tasks:
  - name: install nginx if os RHEL
    ansible.builtin.dnf:
      name: nginx
      state: installed
      started: yes
    when: ansible_os_family== "Redhat"

  - name: install nginx if os ubuntu
    ansible.builtin.apt:
      name: nginx
      state: installed
    when: ansible_os_family== "Debian" 
      
