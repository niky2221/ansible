- name: install nginx
  hosts: web
  become: yes
  tasks:
  - name: install nginx if os RHEL
    ansible.builtin.dnf:
      name: nginx
      state: present
    when: ansible_os_family == "RedHat"
  
  - name: run the service
    ansible.builtin.service:
      name: nginx
      state: started

  - name: install nginx if os ubuntu
    ansible.builtin.apt:
      name: nginx
      state: installed
    when: ansible_os_family == "Debian" 
      
