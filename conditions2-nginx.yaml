- name: install nginx
  hosts: local
  connection: local
  become: yes
  tasks:
  - name: install nginx if os RHEL
    ansible.builtin.dnf:
      name: nginx
      state: removed
      service: yes
    when: ansible_os_family == "RedHat"

  - name: install nginx if os ubuntu
    ansible.builtin.apt:
      name: nginx
      state: installed
    when: ansible_os_family == "Debian" 
      
