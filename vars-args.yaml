- name: variable from files
  hosts: local
  connection: local
  tasks:
    - name: print the variable
      ansible.builtin.debug:
        msg: "Course is {{ COURSE }}, Duration is {{ DURATION }}, Trainer is {{ TRAINER }}"

  # run : ansible-playbook -i inventory.ini vars-args.yaml -e "COURSE=devops" -e "DURATION=120HRS" -e "TRAINER=SHIVAKUMAR"