-name: given number is greaterthan 10 or not
hosts: local
connection: local
vars:
  my_number: 15
tasks:
- name: given number is greater than 10 or not
  ansible.builtin.debug:
    msg: "Given number {{ my_number }} is greater than 10"
  when: my_number > 10

- name: given number is greaterthan or equal to 10
  ansible.builtin.debug:
    msg: "Given number {{ my_number }} is greaterthan or equal to 10"
  when: my_number <= 10